apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  template:
    metadata:
      labels:
        io.kompose.service: backend
    spec:
      containers:
        - env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: postgres://postgres:postgres@postgres:5432/tododb
            - name: REDIS_URL
              value: redis://redis:6379
            - name: JWT_SECRET
              value: supersecret_todolist_jwt_key_2026_k8s
            - name: FRONTEND_URL
              value: http://localhost:3000
          image: backend:latest
          name: backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
      restartPolicy: Always
